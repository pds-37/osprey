version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://guardianos:guardianos_pw@postgres:5432/guardianos
      - SYNC_DATABASE_URL=postgresql://guardianos:guardianos_pw@postgres:5432/guardianos
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=guardianos_pw
      - USE_IN_MEMORY_GRAPH=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - neo4j
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=guardianos
      - POSTGRES_USER=guardianos
      - POSTGRES_PASSWORD=guardianos_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    environment:
      - NEO4J_AUTH=neo4j/guardianos_pw
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
