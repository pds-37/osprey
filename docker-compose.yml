services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random value of at least 32 bytes}
      AUTH_USERS_JSON: ${AUTH_USERS_JSON:?Set AUTH_USERS_JSON to configured account hashes and roles}
      STATE_DB_PATH: /data/osprey-state.sqlite3
      USE_IN_MEMORY_GRAPH: "true"
      ALLOWED_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
    volumes:
      - osprey_state:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osprey_state:
