[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osprey-sc"
version = "0.1.0"
description = "Software supply chain vulnerability triage with evidence-backed static reachability analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Osprey Contributors" }
]
keywords = ["security", "supply-chain", "sbom", "vulnerability", "cve", "osv", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "httpx>=0.25.0",
    "packageurl-python>=0.11.0",
    "pyyaml>=6.0.1",
    "packaging>=23.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.25,<0.26",
]

[project.urls]
Homepage = "https://github.com/pds-37/osprey"
Issues = "https://github.com/pds-37/osprey/issues"
Changelog = "https://github.com/pds-37/osprey/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[project.scripts]
osprey = "osprey.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/osprey"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
